server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;

    # The browser only talks to this server. It forwards /api to the API (ADR-0006). The API sets
    # its own security headers on these responses.
    location /api/ {
        # Docker's own DNS. Using a variable makes nginx look the API up again as it changes (for
        # example after a restart) instead of keeping the address it found at start-up.
        resolver 127.0.0.11 valid=10s ipv6=off;
        resolver_timeout 3s;
        set $api_upstream http://api:4000;
        # Fail fast when the API is down, so the page can show its error state instead of waiting.
        proxy_connect_timeout 3s;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serve the built files. Unknown paths fall back to the app.
    location / {
        # docs/security.md section 10. The app loads only its own scripts and styles, so the
        # policy allows only this origin. img-src also allows data: for the page icon.
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri /index.html;
    }
}
