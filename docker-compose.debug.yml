# Opt-in: publishes PostgreSQL on this machine only (127.0.0.1) for local development and the
# tests. It is not part of the normal stack, so the database is not reachable from outside by
# default (docs/security.md section 3). Use it together with the main file:
#   docker compose -f docker-compose.yml -f docker-compose.debug.yml up -d db
services:
  db:
    ports:
      - '127.0.0.1:${DB_PORT:-5432}:5432'
